[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-terminal"
version = "0.3.0"
description = "异步 PTY 终端会话控制 MCP Server，支持 cursor 环形输出缓冲。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
]

[project.scripts]
mcp-terminal = "mcp_terminal.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".work", ".venv"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
